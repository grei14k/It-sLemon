<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kasir — It's Lemon</title><link rel="stylesheet" href="/pos/style.css"></head><body><header class="topbar"><div class="brand">🍋 IT'S LEMON · KASIR</div><div class="top-actions"><a href="/" style="color:white">Website</a><button class="btn secondary small" onclick="LemonPOS.logout()">Keluar</button></div></header><main class="wrap"><div class="toolbar"><div><p class="eyebrow">POINT OF SALE</p><h1>Transaksi baru</h1><p class="muted">Pilih minuman. Stok dicek ulang oleh server saat transaksi disimpan.</p></div><button class="btn secondary" onclick="loadProducts()">Muat ulang produk</button></div><div class="grid"><section class="panel"><h2>Daftar produk</h2><div id="products" class="products"><p class="muted">Memuat produk…</p></div></section><section class="panel"><h2>Keranjang</h2><div id="cart"><p class="empty">Belum ada produk.</p></div><div class="total"><span>Total</span><span id="total">Rp0</span></div><label>Catatan (opsional)<input id="notes" maxlength="500" placeholder="Contoh: tanpa es"></label><button class="btn primary" style="width:100%;margin-top:14px" id="checkout" onclick="checkout()">Selesaikan transaksi</button><p id="message" class="message" style="margin-top:10px"></p></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/pos/app.js"></script><script>
let products=[],cart=new Map();
async function guard(){await LemonPOS.init();const me=await LemonPOS.api('/api/me');if(!['admin','cashier'].includes(me.profile.role))throw Error('Akun tidak memiliki akses kasir.');}
async function loadProducts(){const el=document.getElementById('products');el.innerHTML='<p class="muted">Memuat…</p>';try{const d=await LemonPOS.api('/api/products');products=d.products;el.innerHTML=products.filter(p=>p.active).map(p=>`<article class="product"><h3>${LemonPOS.escapeHTML(p.name)}</h3><div class="price">${LemonPOS.rupiah(p.price)}</div><div class="stock">Stok: ${p.stock}</div><button class="btn secondary" ${p.stock<1||p.price<1?'disabled':''} onclick="add('${p.id}')">Tambah</button>${p.price<1?'<small class="muted">Harga belum diatur admin</small>':''}</article>`).join('')||'<p class="empty">Belum ada produk aktif.</p>';}catch(e){el.innerHTML=`<p class="message">${LemonPOS.escapeHTML(e.message)}</p>`}}
function add(id){const p=products.find(x=>x.id===id);if(!p||p.stock<1)return;const q=cart.get(id)||0;if(q>=p.stock){msg('Jumlah melebihi stok yang terlihat.');return;}cart.set(id,q+1);renderCart();}
function change(id,delta){const p=products.find(x=>x.id===id);const q=(cart.get(id)||0)+delta;if(q<=0)cart.delete(id);else if(q>p.stock)msg('Jumlah melebihi stok yang terlihat.');else cart.set(id,q);renderCart();}
function renderCart(){let total=0;const rows=[...cart.entries()];document.getElementById('cart').innerHTML=rows.length?rows.map(([id,q])=>{const p=products.find(x=>x.id===id);const sub=p.price*q;total+=sub;return `<div class="cart-row"><div><b>${LemonPOS.escapeHTML(p.name)}</b><div class="muted">${LemonPOS.rupiah(p.price)} × ${q}</div></div><div class="qty"><button onclick="change('${id}',-1)">−</button><b>${q}</b><button onclick="change('${id}',1)">+</button></div></div>`}).join(''):'<p class="empty">Belum ada produk.</p>';document.getElementById('total').textContent=LemonPOS.rupiah(total);}
function msg(t){document.getElementById('message').textContent=t;}
async function checkout(){const button=document.getElementById('checkout');if(!cart.size)return msg('Keranjang masih kosong.');button.disabled=true;msg('Memproses transaksi…');try{const d=await LemonPOS.api('/api/transactions',{method:'POST',body:JSON.stringify({items:[...cart.entries()].map(([product_id,quantity])=>({product_id,quantity})),notes:document.getElementById('notes').value})});alert(`Transaksi berhasil!\nID: ${d.transaction.id}\nTotal: ${LemonPOS.rupiah(d.transaction.total_amount)}`);cart.clear();document.getElementById('notes').value='';await loadProducts();renderCart();msg('Transaksi berhasil disimpan.');}catch(e){msg(e.message);await loadProducts();}finally{button.disabled=false;}}
guard().then(loadProducts).catch(e=>{msg(e.message);setTimeout(()=>location.href='/pos/login.html',900)});
</script></body></html>
