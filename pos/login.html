<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Staf — It's Lemon</title><link rel="stylesheet" href="/pos/style.css"></head><body><main class="auth-wrap"><form id="loginForm" class="panel auth-panel"><div class="brand-mark">🍋</div><p class="eyebrow">IT'S LEMON · STAFF ONLY</p><h1>Login staf</h1><p class="muted">Masuk menggunakan akun admin atau kasir.</p><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit">Login</button><p id="message" class="message" role="status"></p><a class="back-link" href="/">← Kembali ke website pelanggan</a></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/pos/app.js"></script><script>
(async()=>{try{await LemonPOS.init();document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('message');m.textContent='Memeriksa akun…';try{const {data,error}=await LemonPOS.client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;const me=await LemonPOS.api('/api/me');location.href=me.profile.role==='admin'?'/admin/':'/pos/';}catch(err){m.textContent=err.message||'Login gagal.';}});}catch(e){document.getElementById('message').textContent=e.message;}})();
</script></body></html>
