<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — It's Lemon</title><link rel="stylesheet" href="/pos/style.css"></head><body><header class="topbar"><div class="brand">🍋 IT'S LEMON · ADMIN</div><div class="top-actions"><a href="/pos/" style="color:white">Halaman kasir</a><button class="btn secondary small" onclick="LemonPOS.logout()">Keluar</button></div></header><main class="wrap"><div class="toolbar"><div><p class="eyebrow">INVENTORY MANAGEMENT</p><h1>Dashboard admin</h1><p class="muted">Atur harga dan stok. Perubahan tersimpan di database online.</p></div><button class="btn secondary" onclick="refresh()">Muat ulang</button></div><section class="panel"><h2 id="formTitle">Tambah produk</h2><form id="productForm" class="form-grid"><input id="productId" type="hidden"><label>Nama produk<input id="name" maxlength="120" required placeholder="Nama minuman"></label><label>Harga (Rp)<input id="price" type="number" min="0" step="1" required value="0"></label><label>Stok<input id="stock" type="number" min="0" step="1" required value="0"></label><button class="btn primary" type="submit">Simpan</button></form><p id="message" class="message" style="margin-top:10px"></p></section><section class="panel section-gap"><h2>Produk dan stok</h2><div class="table-wrap"><table><thead><tr><th>Produk</th><th>Harga</th><th>Stok</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="productRows"><tr><td colspan="5">Memuat…</td></tr></tbody></table></div></section><section class="panel section-gap"><div class="toolbar"><h2 style="margin:0">Riwayat transaksi terakhir</h2><button class="btn secondary small" onclick="loadTransactions()">Muat ulang</button></div><div class="table-wrap"><table><thead><tr><th>Waktu</th><th>ID transaksi</th><th>Total</th><th>Kasir ID</th></tr></thead><tbody id="transactionRows"><tr><td colspan="4">Memuat…</td></tr></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/pos/app.js"></script><script>
let products=[];function msg(t){document.getElementById('message').textContent=t;}
async function guard(){await LemonPOS.init();const me=await LemonPOS.api('/api/me');if(me.profile.role!=='admin')throw Error('Halaman ini hanya untuk admin.');}
async function loadProducts(){const d=await LemonPOS.api('/api/products');products=d.products;document.getElementById('productRows').innerHTML=products.map(p=>`<tr><td>${LemonPOS.escapeHTML(p.name)}</td><td>${LemonPOS.rupiah(p.price)}</td><td>${p.stock}</td><td>${p.active?'<span class="pill">Aktif</span>':'Nonaktif'}</td><td><button class="btn secondary small" onclick="editProduct('${p.id}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="5">Belum ada produk.</td></tr>';}
function editProduct(id){const p=products.find(x=>x.id===id);document.getElementById('productId').value=p.id;document.getElementById('name').value=p.name;document.getElementById('price').value=p.price;document.getElementById('stock').value=p.stock;document.getElementById('formTitle').textContent='Edit produk';window.scrollTo({top:0,behavior:'smooth'});}
document.getElementById('productForm').addEventListener('submit',async e=>{e.preventDefault();const id=document.getElementById('productId').value;const payload={name:document.getElementById('name').value.trim(),price:Number(document.getElementById('price').value),stock:Number(document.getElementById('stock').value),active:true};try{await LemonPOS.api('/api/products',{method:id?'PATCH':'POST',body:JSON.stringify(id?{...payload,id}:payload)});msg('Produk berhasil disimpan.');e.target.reset();document.getElementById('productId').value='';document.getElementById('price').value='0';document.getElementById('stock').value='0';document.getElementById('formTitle').textContent='Tambah produk';await loadProducts();}catch(err){msg(err.message);}});
async function loadTransactions(){try{const d=await LemonPOS.api('/api/transactions');document.getElementById('transactionRows').innerHTML=d.transactions.map(t=>`<tr><td>${new Date(t.created_at).toLocaleString('id-ID')}</td><td title="${t.id}">${t.id.slice(0,8)}…</td><td>${LemonPOS.rupiah(t.total_amount)}</td><td title="${t.cashier_id}">${t.cashier_id.slice(0,8)}…</td></tr>`).join('')||'<tr><td colspan="4">Belum ada transaksi.</td></tr>';}catch(e){document.getElementById('transactionRows').innerHTML=`<tr><td colspan="4">${LemonPOS.escapeHTML(e.message)}</td></tr>`;}}
async function refresh(){try{await loadProducts();await loadTransactions();msg('Data diperbarui.');}catch(e){msg(e.message);}}
guard().then(refresh).catch(e=>{msg(e.message);setTimeout(()=>location.href='/pos/login.html',900)});
</script></body></html>
